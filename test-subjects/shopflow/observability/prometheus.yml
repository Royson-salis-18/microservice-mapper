# Job name == service name, so the mapper's Tier-2 source attributes each series to the right node.
global: { scrape_interval: 5s }
scrape_configs:
  - { job_name: catalog,         static_configs: [{ targets: ["catalog:3001"] }] }
  - { job_name: cart,            static_configs: [{ targets: ["cart:3002"] }] }
  - { job_name: inventory,       static_configs: [{ targets: ["inventory:3003"] }] }
  - { job_name: payments,        static_configs: [{ targets: ["payments:3004"] }] }
  - { job_name: orders,          static_configs: [{ targets: ["orders:3005"] }] }
  - { job_name: notifier,        static_configs: [{ targets: ["notifier:3006"] }] }
  - { job_name: psp-sandbox,     static_configs: [{ targets: ["psp-sandbox:4000"] }] }
